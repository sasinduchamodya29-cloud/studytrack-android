name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths: ['renderer/**', 'android-app/**', '.github/workflows/android-apk.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install + build web assets
        working-directory: android-app
        run: |
          npm install
          node scripts/prepare-www.js
      - name: Create Android project
        working-directory: android-app
        run: |
          npx cap add android
          node scripts/patch-android.js
          mkdir -p resources && cp ../build/icon.png resources/icon.png
          npx capacitor-assets generate --android --iconBackgroundColor '#0a0a0f' --splashBackgroundColor '#0a0a0f' || true
          npx cap sync android
      - name: Build APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: StudyTrack-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
